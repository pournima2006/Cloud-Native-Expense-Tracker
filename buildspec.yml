#1234
version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies..."
      - npm ci
      - cd backend && npm ci && cd ..
      - cd frontend && npm ci && cd ..

  pre_build:
    commands:
      - echo "Running pre-build checks..."
      - npm run lint || true

  build:
    commands:
      - echo "Building fullstack application..."
      - npm run build

  post_build:
    commands:
      - echo "Preparing artifacts for deployment..."

artifacts:
  files:
    - 'dist/**/*'
    - 'frontend/dist/**/*'
    - 'package.json'
    - 'package-lock.json'
    - 'backend/package.json'
    - 'appspec.yml'
    - 'scripts/**/*'
  discard-paths: no
